            final String[] names = {"🤡 Palhaço Risonho", "🎈 Palhaço do Esgoto", "🎪 Palhaço do Circo", "🔪 Assassino Mascarado"};
            // pitch, dbl, ring, rev, vol, hp, presenca
            final float[][] pre = {
              {4, 0, .12f, .15f, 2.6f, 260, 7},
              {-3, .35f, 0, .20f, 2.6f, 220, 6},
              {6, .20f, .18f, .25f, 2.5f, 280, 8},
              {-8, 0, 0, .10f, 2.6f, 170, 5}};
            final List<Button> presetBtns = new ArrayList<>();

name: Gerar APK Voz de Terror

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        run: |
          mkdir -p app && cd app
          mkdir -p src/main/java/com/vozdeterror

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VozDeTerror"
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'com.vozdeterror'
            compileSdk 34
            defaultConfig {
              applicationId 'com.vozdeterror'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            lint { abortOnError false; checkReleaseBuilds false }
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <application android:label="Voz de Terror" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > src/main/java/com/vozdeterror/MainActivity.java <<'EOF'
          package com.vozdeterror;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.*;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
            static final int SR = 48000;
            volatile boolean running = false;
            Thread th;
            volatile float pitch = 4, dbl = 0, ring = .12f, rev = .15f, vol = 2.6f, gate = 0, hpF = 260, presDb = 7;
            volatile boolean dirty = true;
            AudioManager am;
            Spinner micSp;
            final List<AudioDeviceInfo> mics = new ArrayList<>();
            TextView msg;
            Button go;
            SeekBar sbPitch, sbVol, sbGate, sbRev;
            TextView tvPitch, tvVol, tvGate, tvRev;
            final String[] names = {"🤡 Palhaço Risonho", "🎈 Palhaço do Esgoto", "🎪 Palhaço do Circo", "🔪 Assassino Mascarado"};
            // pitch, dbl, ring, rev, vol, hp, presenca
            final float[][] pre = {
              {4, 0, .12f, .15f, 2.6f, 260, 7},
              {-3, .35f, 0, .20f, 2.6f, 220, 6},
              {6, .20f, .18f, .25f, 2.5f, 280, 8},
              {-8, 0, 0, .10f, 2.6f, 170, 5}};
            final List<Button> presetBtns = new ArrayList<>();
            static final int RED = Color.rgb(255, 59, 59), CARD = Color.rgb(26, 18, 20), BG = Color.rgb(13, 10, 11), FG = Color.rgb(234, 223, 216), MUT = Color.rgb(154, 135, 128);

            @Override protected void onCreate(Bundle s) {
              super.onCreate(s);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              setVolumeControlStream(AudioManager.STREAM_MUSIC);
              am = (AudioManager) getSystemService(AUDIO_SERVICE);
              ScrollView sv = new ScrollView(this);
              sv.setBackgroundColor(BG);
              LinearLayout L = new LinearLayout(this);
              L.setOrientation(LinearLayout.VERTICAL);
              int p = dp(16);
              L.setPadding(p, dp(28), p, dp(40));
              sv.addView(L);

              TextView t = new TextView(this);
              t.setText("VOZ DE TERROR");
              t.setTextColor(RED); t.setTextSize(30); t.setTypeface(Typeface.SERIF, Typeface.BOLD);
              L.addView(t);
              TextView sub = tv("Fale no microfone. A voz alterada sai pelo alto-falante.", MUT, 14);
              L.addView(sub);

              L.addView(tv("Microfone", MUT, 13));
              micSp = new Spinner(this);
              micSp.setBackgroundColor(CARD);
              L.addView(micSp, lp(dp(48)));
              micSp.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                public void onItemSelected(AdapterView<?> a, View v, int i, long id) { if (running) { stop(); start(); } }
                public void onNothingSelected(AdapterView<?> a) {}
              });

              go = new Button(this);
              go.setText("▶ LIGAR"); go.setTextSize(22); go.setTextColor(Color.WHITE);
              go.setBackgroundColor(Color.rgb(179, 18, 29));
              LinearLayout.LayoutParams glp = lp(dp(72)); glp.topMargin = dp(12);
              L.addView(go, glp);
              go.setOnClickListener(v -> { if (running) stop(); else start(); });

              msg = tv("Plugue o receptor do microfone antes de ligar.", MUT, 13);
              L.addView(msg);

              GridLayout g = new GridLayout(this);
              g.setColumnCount(2);
              for (int i = 0; i < names.length; i++) {
                final int k = i;
                Button b = new Button(this);
                b.setText(names[i]); b.setAllCaps(false); b.setTextColor(FG); b.setBackgroundColor(CARD);
                GridLayout.LayoutParams gp = new GridLayout.LayoutParams(GridLayout.spec(i / 2, 1f), GridLayout.spec(i % 2, 1f));
                gp.width = 0; gp.height = dp(56); gp.setMargins(dp(4), dp(4), dp(4), dp(4));
                g.addView(b, gp);
                presetBtns.add(b);
                b.setOnClickListener(v -> loadPreset(k));
              }
              LinearLayout.LayoutParams gl = lp(ViewGroup.LayoutParams.WRAP_CONTENT); gl.topMargin = dp(12);
              L.addView(g, gl);

              tvPitch = tv("", MUT, 13); L.addView(tvPitch);
              sbPitch = seek(L, 20);
              tvRev = tv("", MUT, 13); L.addView(tvRev);
              sbRev = seek(L, 100);
              tvVol = tv("", MUT, 13); L.addView(tvVol);
              sbVol = seek(L, 400);
              tvGate = tv("", MUT, 13); L.addView(tvGate);
              sbGate = seek(L, 100);

              setContentView(sv);
              loadPreset(0);
              refreshMics();
              am.registerAudioDeviceCallback(new AudioDeviceCallback() {
                public void onAudioDevicesAdded(AudioDeviceInfo[] d) { refreshMics(); }
                public void onAudioDevicesRemoved(AudioDeviceInfo[] d) { refreshMics(); }
              }, new Handler(Looper.getMainLooper()));
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
            }

            int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }
            LinearLayout.LayoutParams lp(int h) { return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, h); }
            TextView tv(String s, int c, int sz) { TextView x = new TextView(this); x.setText(s); x.setTextColor(c); x.setTextSize(sz); x.setPadding(0, dp(10), 0, dp(4)); return x; }
            SeekBar seek(LinearLayout L, int max) {
              SeekBar b = new SeekBar(this); b.setMax(max);
              L.addView(b, lp(dp(40)));
              b.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                public void onProgressChanged(SeekBar s, int v, boolean u) { readUi(); }
                public void onStartTrackingTouch(SeekBar s) {}
                public void onStopTrackingTouch(SeekBar s) {}
              });
              return b;
            }

            void loadPreset(int k) {
              float[] q = pre[k];
              for (int i = 0; i < presetBtns.size(); i++) presetBtns.get(i).setTextColor(i == k ? RED : FG);
              dbl = q[1]; ring = q[2]; hpF = q[5]; presDb = q[6];
              sbPitch.setProgress((int) q[0] + 12);
              sbRev.setProgress((int) (q[3] * 100));
              sbVol.setProgress((int) (q[4] * 100));
              sbGate.setProgress(0);
              readUi();
            }

            void readUi() {
              if (sbGate == null) return;
              pitch = sbPitch.getProgress() - 12;
              rev = sbRev.getProgress() / 100f;
              vol = sbVol.getProgress() / 100f;
              gate = sbGate.getProgress() * 0.0003f;
              tvPitch.setText("Tom: " + (int) pitch + " semitons");
              tvRev.setText("Eco: " + sbRev.getProgress());
              tvVol.setText("Volume: " + sbVol.getProgress());
              tvGate.setText("Corte de ruído: " + sbGate.getProgress() + (sbGate.getProgress() == 0 ? " (desligado)" : ""));
              dirty = true;
            }

            void refreshMics() {
              mics.clear();
              List<String> labels = new ArrayList<>();
              labels.add("Automático (prefere o externo)");
              mics.add(null);
              int usbIdx = 0;
              for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_INPUTS)) {
                int ty = d.getType();
                boolean ext = ty == AudioDeviceInfo.TYPE_USB_DEVICE || ty == AudioDeviceInfo.TYPE_USB_HEADSET || ty == AudioDeviceInfo.TYPE_WIRED_HEADSET;
                if (ty == AudioDeviceInfo.TYPE_TELEPHONY) continue;
                String n = (ext ? "★ " : "") + d.getProductName() + " (" + typeName(ty) + ")";
                labels.add(n); mics.add(d);
                if (ext && usbIdx == 0) usbIdx = mics.size() - 1;
              }
              ArrayAdapter<String> a = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_item, labels) {
                public View getView(int i, View c, ViewGroup p) { TextView v = (TextView) super.getView(i, c, p); v.setTextColor(FG); return v; }
              };
              a.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
              micSp.setAdapter(a);
              micSp.setSelection(usbIdx);
            }

            String typeName(int t) {
              switch (t) {
                case AudioDeviceInfo.TYPE_BUILTIN_MIC: return "celular";
                case AudioDeviceInfo.TYPE_USB_DEVICE: case AudioDeviceInfo.TYPE_USB_HEADSET: return "USB";
                case AudioDeviceInfo.TYPE_BLUETOOTH_SCO: return "Bluetooth";
                case AudioDeviceInfo.TYPE_WIRED_HEADSET: return "fio";
                default: return "outro";
              }
            }

            AudioDeviceInfo chosenMic() {
              int i = micSp.getSelectedItemPosition();
              if (i > 0 && i < mics.size()) return mics.get(i);
              for (AudioDeviceInfo d : mics) if (d != null && (d.getType() == AudioDeviceInfo.TYPE_USB_DEVICE || d.getType() == AudioDeviceInfo.TYPE_USB_HEADSET)) return d;
              return null;
            }

            void start() {
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                msg.setText("Permita o microfone e toque em LIGAR de novo.");
                return;
              }
              final AudioDeviceInfo mic = chosenMic();
              running = true;
              go.setText("■ DESLIGAR");
              th = new Thread(() -> loop(mic), "audio");
              th.setPriority(Thread.MAX_PRIORITY);
              th.start();
            }

            void stop() {
              running = false;
              try { if (th != null) th.join(500); } catch (Exception ignored) {}
              go.setText("▶ LIGAR");
            }

            @Override protected void onDestroy() { stop(); super.onDestroy(); }

            void ui(String s) { runOnUiThread(() -> msg.setText(s)); }

            @SuppressWarnings("MissingPermission")
            void loop(AudioDeviceInfo mic) {
              android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO);
              am.setMode(AudioManager.MODE_NORMAL);
              AudioFormat inF = new AudioFormat.Builder().setSampleRate(SR).setEncoding(AudioFormat.ENCODING_PCM_FLOAT).setChannelMask(AudioFormat.CHANNEL_IN_MONO).build();
              AudioFormat outF = new AudioFormat.Builder().setSampleRate(SR).setEncoding(AudioFormat.ENCODING_PCM_FLOAT).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build();
              int minR = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_FLOAT);
              int src = Build.VERSION.SDK_INT >= 29 ? MediaRecorder.AudioSource.VOICE_PERFORMANCE : MediaRecorder.AudioSource.MIC;
              AudioRecord ar = null;
              try {
                ar = new AudioRecord.Builder().setAudioSource(src).setAudioFormat(inF).setBufferSizeInBytes(minR * 2).build();
                if (ar.getState() != AudioRecord.STATE_INITIALIZED) { ar.release(); ar = null; }
              } catch (Exception e) { ar = null; }
              if (ar == null) ar = new AudioRecord.Builder().setAudioSource(MediaRecorder.AudioSource.MIC).setAudioFormat(inF).setBufferSizeInBytes(minR * 2).build();
              if (mic != null) ar.setPreferredDevice(mic);

              int minT = AudioTrack.getMinBufferSize(SR, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_FLOAT);
              AudioTrack at = new AudioTrack.Builder()
                .setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                .setAudioFormat(outF).setBufferSizeInBytes(minT).setTransferMode(AudioTrack.MODE_STREAM)
                .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY).build();
              for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS))
                if (d.getType() == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER) { at.setPreferredDevice(d); break; }

              DSP dsp = new DSP();
              float[] buf = new float[96];
              float[] out = new float[96];
              try {
                ar.startRecording();
                at.play();
                AudioDeviceInfo real = ar.getRoutedDevice();
                int ms = (minT / 4) * 1000 / SR + (minR / 4) * 1000 / SR / 2 + 6;
                ui("Ativo • mic: " + (real != null ? real.getProductName() + " (" + typeName(real.getType()) + ")" : "?") + " • atraso aprox. " + ms + " ms");
                while (running) {
                  int n = ar.read(buf, 0, buf.length, AudioRecord.READ_BLOCKING);
                  if (n <= 0) continue;
                  if (dirty) { dsp.update(this); dirty = false; }
                  for (int i = 0; i < n; i++) out[i] = dsp.process(buf[i], this);
                  at.write(out, 0, n, AudioTrack.WRITE_BLOCKING);
                }
              } catch (Exception e) {
                ui("Erro: " + e.getMessage());
              } finally {
                try { ar.stop(); } catch (Exception ignored) {}
                ar.release();
                try { at.stop(); } catch (Exception ignored) {}
                at.release();
                running = false;
                runOnUiThread(() -> go.setText("▶ LIGAR"));
              }
            }

            static class BQ {
              float b0 = 1, b1, b2, a1, a2, z1, z2;
              void set(double B0, double B1, double B2, double A1, double A2) { b0 = (float) B0; b1 = (float) B1; b2 = (float) B2; a1 = (float) A1; a2 = (float) A2; }
              void hp(double f, double q) { double w = 2 * Math.PI * f / SR, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al; set((1 + c) / 2 / a0, -(1 + c) / a0, (1 + c) / 2 / a0, -2 * c / a0, (1 - al) / a0); }
              void lp(double f, double q) { double w = 2 * Math.PI * f / SR, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al; set((1 - c) / 2 / a0, (1 - c) / a0, (1 - c) / 2 / a0, -2 * c / a0, (1 - al) / a0); }
              void peak(double f, double q, double db) { double A = Math.pow(10, db / 40), w = 2 * Math.PI * f / SR, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al / A; set((1 + al * A) / a0, -2 * c / a0, (1 - al * A) / a0, -2 * c / a0, (1 - al / A) / a0); }
              float p(float x) { float y = b0 * x + z1; z1 = b1 * x - a1 * y + z2; z2 = b2 * x - a2 * y; return y; }
            }

            static class PS {
              final float[] b = new float[4096]; int w = 0; float ph = 0; final int W;
              PS(int W) { this.W = W; }
              float rd(float d) { float pos = w - d - 2; pos = ((pos % 4096) + 4096) % 4096; int i0 = (int) pos; float f = pos - i0; return b[i0 & 4095] * (1 - f) + b[(i0 + 1) & 4095] * f; }
              float p(float x, float r) {
                b[w] = x; float y;
                if (r == 1f) y = x;
                else {
                  ph = (ph + (1 - r) + W) % W;
                  float d1 = ph, d2 = (ph + W / 2f) % W;
                  float a1 = (float) Math.sin(Math.PI * d1 / W), a2 = (float) Math.sin(Math.PI * d2 / W);
                  y = rd(d1) * a1 * a1 + rd(d2) * a2 * a2;
                }
                w = (w + 1) & 4095;
                return y;
              }
            }

            static class DSP {
              final BQ hp = new BQ(), lp = new BQ(), pres = new BQ();
              final PS ps1 = new PS(SR * 12 / 1000), ps2 = new PS(SR * 12 / 1000);
              final float[] dl = new float[SR];
              int di = 0;
              final int dDelay = SR * 110 / 1000;
              float r1 = 1, r2 = .5f, env = 0, g = 1, lenv = 0, tp = 0;
              DSP() { lp.lp(6500, 0.7); }
              void update(MainActivity m) {
                hp.hp(m.hpF, 0.7);
                pres.peak(2600, 0.8, m.presDb);
                r1 = (float) Math.pow(2, m.pitch / 12.0);
                r2 = (float) Math.pow(2, (m.pitch - 12) / 12.0);
              }
              float process(float x, MainActivity m) {
                x = hp.p(x);
                float a = Math.abs(x);
                env = a > env ? env + (a - env) * 0.2f : env * 0.99985f;
                float tg = m.gate <= 0 ? 1 : Math.min(1, (env / m.gate) * (env / m.gate));
                g += (tg - g) * (tg > g ? 0.05f : 0.00015f);
                float y = ps1.p(x, r1);
                float d = ps2.p(x, r2);
                y = (y + d * m.dbl * 0.8f) * g;
                tp += (float) (2 * Math.PI * 38 / SR); if (tp > 6.2832f) tp -= 6.2832f;
                float rg = m.ring * 0.6f;
                y *= (1 - rg) + rg * (float) Math.sin(tp);
                y = lp.p(y);
                int rIdx = di - dDelay; if (rIdx < 0) rIdx += dl.length;
                float e = dl[rIdx];
                dl[di] = y + e * 0.35f;
                di = (di + 1) % dl.length;
                y = y + e * m.rev;
                y = pres.p(y) * m.vol;
                float ay = Math.abs(y);
                lenv = ay > lenv ? ay : lenv * 0.9995f;
                if (lenv > 0.7f) y *= 0.7f / lenv;
                if (y > 0.98f) y = 0.98f; else if (y < -0.98f) y = -0.98f;
                return y;
              }
            }
          }
          EOF

      - name: Compilar APK
        working-directory: app
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Voz de Terror ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
